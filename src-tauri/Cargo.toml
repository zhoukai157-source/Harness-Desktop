[package]
name = "dsh-desktop"
version = "0.1.0"
description = "Native macOS desktop shell for DeepSeek Harness (dsh web)"
authors = ["zhoukai"]
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
name = "dsh_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
objc2 = { version = "0.6.4" }
objc2-app-kit = { version = "0.3.2", features = ["block2"] }
objc2-foundation = { version = "0.3.2" }
objc2-web-kit = { version = "0.3.2", features = ["block2"] }
block2 = { version = "0.6", features = ["alloc"] }
